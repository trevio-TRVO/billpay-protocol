name: Vérifier et déployer BillPay Hub sur GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["hub/**", "site/**", "site-tools/**", ".github/workflows/**", ".gitignore"]
  pull_request:
    branches: ["main"]
    paths: ["hub/**", "site/**", "site-tools/**", ".github/workflows/**", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: hub

      - name: Build statique (next build, output export)
        run: npm run build
        working-directory: hub

      - name: Vérifier les routes et fichiers publiés
        run: npm run test:export
        working-directory: hub

      - name: Vérifier les sources statiques et les pages V2
        run: node site-tools/build.mjs && git diff --exit-code -- site && node --test site-tools/static.test.mjs

      - name: Préparer l’export actuel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BILLPAY_PAGES_SOURCE != 'static-v2'
        uses: actions/upload-pages-artifact@v3
        with:
          path: hub/out

      - name: Préparer la V2 statique
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.BILLPAY_PAGES_SOURCE == 'static-v2'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
