name: Déployer BillPay Hub (Next.js) sur GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["hub/**", "supabase/**", "site/assets/favicon.svg", ".github/workflows/**", ".gitignore"]
  pull_request:
    branches: ["main"]
    paths: ["hub/**", "supabase/**", "site/assets/favicon.svg", ".github/workflows/**", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: hub

      - name: Build statique (next build, output export)
        run: npm run build
        working-directory: hub
        env:
          NEXT_PUBLIC_BILLPAY_ACCOUNTS_ENABLED: ${{ vars.BILLPAY_ACCOUNTS_ENABLED }}
          NEXT_PUBLIC_BILLPAY_SUPABASE_URL: ${{ vars.BILLPAY_SUPABASE_URL }}
          NEXT_PUBLIC_BILLPAY_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BILLPAY_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_BILLPAY_TURNSTILE_SITE_KEY: ${{ vars.BILLPAY_TURNSTILE_SITE_KEY }}

      - name: Vérifier les routes et fichiers publiés
        run: npm run test:export && npm run test:accounts
        working-directory: hub

      - name: Upload de l'artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: hub/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
