# BillPay Hub (Next.js) — build statique et déploiement GitHub Pages
# Génère hub/out/ (export statique) et le publie sur Pages (domaine billpaytoken.com via hub/public/CNAME).
name: Déployer BillPay Hub (Next.js) sur GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["hub/**", ".github/workflows/nextjs-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Installer les dépendances
        run: npm ci
        working-directory: hub

      - name: Build statique (next build, output export)
        run: npm run build
        working-directory: hub

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload de l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hub/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
